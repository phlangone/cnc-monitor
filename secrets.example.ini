; Template de configuracoes locais e sensiveis.
; Copie este arquivo para secrets.ini e preencha os valores reais.
; O secrets.ini nao deve ser versionado.

[env:opta]
build_flags =
	-D CNC_WIFI_SSID=\"SUA_REDE_WIFI\"
	-D CNC_WIFI_PASSWORD=\"SUA_SENHA_WIFI\"
	-D CNC_MQTT_BROKER=\"SEU_BROKER_MQTT\"
	-D CNC_MQTT_PORT=1883
	-D CNC_MQTT_CLIENT_ID=\"cnc-monitor-opta\"
	-D CNC_MQTT_USERNAME=\"SEU_USUARIO_MQTT\"
	-D CNC_MQTT_PASSWORD=\"SUA_SENHA_MQTT\"
	-D CNC_MQTT_STATE_TOPIC=\"cnc/state\"
